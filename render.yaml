databases:
  - name: eventflow-db
    databaseName: eventflow
    user: eventflow
    plan: free
    ipAllowList: []

services:
  - type: web
    name: eventflow-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Free services do not support one-off jobs or shell access, so keep the
    # starter catalog idempotent for fresh databases.
    startCommand: npm run prisma:deploy && npm run prisma:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://eventflow-event-management.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: eventflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
