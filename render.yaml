databases:
  # Hidden Blueprint/database resource ID. Keep this stable so Render updates
  # the existing database instead of creating a replacement.
  - name: eventflow-db
    databaseName: eventflow
    user: eventflow
    plan: free
    ipAllowList: []

services:
  - type: web
    name: event-management-platform
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Free services do not support one-off jobs or shell access. Keep the
    # idempotent demo seed in startup so fresh databases are always usable.
    startCommand: npm run prisma:deploy && npm run prisma:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eventflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: VITE_ENABLE_DEMO_CHECKOUT
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
